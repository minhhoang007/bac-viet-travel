services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: minh
    ports:
      - "54329:5432" # 54329 avoids clashing with a locally installed Postgres
    volumes:
      - db-data:/var/lib/postgresql
      - ./db/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  # S3-compatible object storage for local development and tests (stands in for Cloudflare R2).
  storage:
    image: chrislusf/seaweedfs
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -s3.allowedOrigins=*
    ports:
      - "58333:8333"
    volumes:
      - storage-data:/data
      - ./db/docker/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  db-data:
  storage-data:

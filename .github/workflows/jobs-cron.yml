name: Jobs tick

# Vercel Hobby runs its cron once a day (vercel.json). This calls the same endpoint every hour, so a VNPay payment
# whose IPN was lost is confirmed within the hour (deposits.reconcile) instead of the next morning. Hourly keeps the
# Neon database asleep most of the time. Secrets: CRON_SECRET (same value as on Vercel), SITE_URL.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/jobs/run
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/jobs/run"

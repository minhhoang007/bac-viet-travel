name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, arch lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --prod --audit-level high

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: minh_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/minh_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # S3-compatible storage for the storage module (service containers cannot take a command).
      - run: docker run -d -p 58333:8333 -v "$PWD/db/docker/s3.json:/etc/seaweedfs/s3.json:ro" chrislusf/seaweedfs server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -s3.allowedOrigins=*
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int

  e2e-app:
    name: Browser E2E (profile app)
    # The starter's generated example app. Projects (they have starter.lock.json) skip it and test their own app in
    # "Build + E2E" (a job-level if cannot read files, so each step checks).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: minh_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/minh_e2e
    steps:
      - uses: actions/checkout@v7
      - id: repo
        run: echo "starter=$([ -f starter.lock.json ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        if: steps.repo.outputs.starter == 'true'
      - uses: actions/setup-node@v7
        if: steps.repo.outputs.starter == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # S3-compatible storage for the storage module (service containers cannot take a command).
      - run: docker run -d -p 58333:8333 -v "$PWD/db/docker/s3.json:/etc/seaweedfs/s3.json:ro" chrislusf/seaweedfs server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -s3.allowedOrigins=*
        if: steps.repo.outputs.starter == 'true'
      - run: pnpm install --frozen-lockfile
        if: steps.repo.outputs.starter == 'true'
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.repo.outputs.starter == 'true'
      - run: pnpm test:e2e:app
        if: steps.repo.outputs.starter == 'true'

  build-minimal:
    # Guards "really off": default config (profile site, all modules off) must build and run with NO secrets.
    # In a project this is the project's own E2E. The build gets no secrets; the Postgres service is only used by
    # projects whose E2E server needs a database (profile app: tests/e2e/server-env.ts reads E2E_DATABASE_URL).
    name: Build + E2E with no secrets
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: project_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/project_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

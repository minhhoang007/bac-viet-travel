# Weekly dependency updates (SECURITY.md: dependencies). Grouped to keep the PR count low;
# security updates still arrive as soon as they are published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned on purpose: dependency-cruiser does not support TypeScript 7 yet (ADR-0001).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Pinned on purpose: eslint-config-next does not support ESLint 10 yet.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
